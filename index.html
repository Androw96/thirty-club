<!doctype html>
<html lang="hu" class="t-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1211">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="30th in the 30s. Zártkörű születésnapi est a harmincas évek stílusában.">
<meta property="og:title" content="30th in the 30s">
<meta property="og:description" content="Személyes meghívó egy harmincas évekbeli születésnapi estére.">
<title>30th in the 30s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Poiret+One&family=Josefin+Sans:wght@300;400;600&display=swap">
<link rel="stylesheet" href="./style.css">
<script src="./texts.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<header class="masthead"><div class="wrap"><a href="./" class="brand"><b data-t="brand.mark"></b><span data-t="brand.tag"></span></a><span class="edition" data-t="brand.edition"></span></div></header>

<main>
  <section class="hero">
    <div class="rays" aria-hidden="true"></div>
    <div class="wrap hero-inner">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1><small data-t="hero.welcome"></small><span data-t="hero.title"></span></h1>
      <p class="tagline" data-t="hero.tagline"></p>

      <div id="door" class="hero-inner" style="padding:0">
        <div class="arch" aria-hidden="true"><span class="num">30</span></div>
        <p class="door-note" id="door-note" role="status"><strong>Egy pillanat</strong>A meghívód betöltése…</p>
      </div>

      <div id="invited" hidden>
        <div class="hero-inner" style="padding:0">
          <p class="lede" id="hero-lede"></p>
          <button class="envelope" id="envelope" type="button" aria-expanded="false" aria-controls="invitation" aria-label="A pecsétes meghívó kinyitása">
            <span class="letter"><span data-t="env.admit"></span><strong id="letter-name">Vendég</strong><i data-t="env.sub"></i></span>
            <span class="pocket"></span><span class="flap"></span>
            <span class="seal"><b>30</b></span>
          </button>
          <button class="open-link" id="open-link" type="button" aria-controls="invitation"><span id="open-label" data-t="env.open"></span> <span class="arrow">↓</span></button>
        </div>
      </div>
    </div>
  </section>

  <div class="invitation" id="invitation" hidden>
    <section class="block">
      <div class="wrap">
        <div class="head"><span class="en" data-t="inv.eyebrow"></span><h2 id="greeting"></h2><span class="rule"><i></i></span></div>
        <div class="prose">
          <p data-t="inv.p1"></p>
          <p data-t="inv.p2"></p>
          <p data-t="inv.p3"></p>
        </div>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <div class="head"><span class="en" data-t="ticket.eyebrow"></span><h2 data-t="ticket.heading"></h2><span class="rule"><i></i></span></div>
        <div class="ticket">
          <div class="ticket-top"><span data-t="ticket.top"></span><b data-t="ticket.no"></b></div>
          <dl class="fields">
            <div><dt data-t="ticket.guest"></dt><dd id="t-guest">—</dd></div>
            <div><dt data-t="ticket.when"></dt><dd id="t-when"></dd></div>
            <div><dt data-t="ticket.where"></dt><dd id="t-where">—</dd></div>
            <div><dt data-t="ticket.pw.label"></dt><dd data-t="ticket.pw"></dd></div>
          </dl>
          <div class="ticket-foot"><span id="t-note"></span><a id="map-link" href="#" target="_blank" rel="noopener" hidden><span data-t="ticket.map"></span></a></div>
        </div>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <div class="head"><span class="en" data-t="prog.eyebrow"></span><h2 data-t="prog.heading"></h2><span class="rule"><i></i></span></div>
        <ol class="program" data-t="prog.list"></ol>
      </div>
    </section>

    <section class="block" id="dresscode">
      <div class="wrap">
        <div class="head"><span class="en" data-t="dress.eyebrow"></span><h2 data-t="dress.heading"></h2><span class="rule"><i></i></span></div>
        <div class="dress">
          <div class="look"><h3 data-t="dress.men.title"></h3><ul data-t="dress.men"></ul></div>
          <div class="look"><h3 data-t="dress.women.title"></h3><ul data-t="dress.women"></ul></div>
        </div>
        <p class="aside" data-t="dress.aside"></p>
      </div>
    </section>

    <section class="block" id="rsvp">
      <div class="wrap">
        <div class="head"><span class="en" data-t="rsvp.eyebrow"></span><h2 data-t="rsvp.heading"></h2><span class="rule"><i></i></span></div>
        <div class="rsvp-box">
          <form id="rsvp-form" novalidate>
            <p id="config-notice" class="notice"></p>
            <input type="text" id="rsvp-honey" name="_honey" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
            <fieldset id="form-fields">
              <legend class="sr-only">Visszajelzés</legend>
              <div>
                <span class="lbl" id="attend-label" data-t="rsvp.attend"></span>
                <div class="choices" role="radiogroup" aria-labelledby="attend-label">
                  <label class="choice"><input type="radio" id="rsvp-yes" name="attending" value="yes" checked><span data-t="rsvp.yes"></span></label>
                  <label class="choice"><input type="radio" id="rsvp-no" name="attending" value="no"><span data-t="rsvp.no"></span></label>
                </div>
              </div>
              <div id="plus-row" hidden>
                <span class="lbl" id="plus-label" data-t="rsvp.plus"></span>
                <div class="choices" role="radiogroup" aria-labelledby="plus-label">
                  <label class="choice"><input type="radio" id="plus-no" name="plusOne" value="no" checked><span data-t="rsvp.plus.no"></span></label>
                  <label class="choice"><input type="radio" id="plus-yes" name="plusOne" value="yes"><span data-t="rsvp.plus.yes"></span></label>
                </div>
                <div id="plus-name-row" hidden style="margin-top:14px">
                  <label class="lbl" for="rsvp-plus-name" data-t="rsvp.plus.name"></label>
                  <input type="text" id="rsvp-plus-name" name="plusOneName" maxlength="100" autocomplete="off" data-t="rsvp.plus.ph" data-t-attr="placeholder">
                </div>
              </div>
              <div>
                <label class="lbl" for="rsvp-notes"><span data-t="rsvp.notes"></span> <span class="optional" data-t="rsvp.optional"></span></label>
                <textarea id="rsvp-notes" name="notes" rows="3" maxlength="2000" data-t="rsvp.notes.ph" data-t-attr="placeholder"></textarea>
              </div>
              <label class="check" for="rsvp-consent"><input type="checkbox" id="rsvp-consent" name="consent"><span data-t="rsvp.consent"></span></label>
              <div class="form-foot"><button class="btn" type="submit" id="rsvp-submit"><span data-t="rsvp.submit"></span></button></div>
            </fieldset>
            <p class="status" id="form-status" role="status" aria-live="polite"></p>
          </form>

          <div class="telegram" id="success" hidden tabindex="-1">
            <div class="tg-head"><span data-t="tg.head"></span><span data-t="tg.head2"></span></div>
            <p id="tg-text"></p>
            <div class="tg-actions">
              <div id="calendar-actions" class="tg-actions" style="margin:0" hidden>
                <a id="google-calendar" class="btn" href="#" target="_blank" rel="noopener"><span data-t="tg.gcal"></span></a>
                <button class="btn ghost" type="button" id="apple-calendar"><span data-t="tg.ics"></span></button>
              </div>
              <button class="btn ghost" type="button" id="edit-rsvp"><span data-t="tg.edit"></span></button>
              <small id="edit-note"><span data-t="tg.editnote"></span></small>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<footer><div class="wrap"><p class="brand-foot" data-t="foot.brand"></p><p data-t="foot.line"></p></div></footer>
</body>
</html>
